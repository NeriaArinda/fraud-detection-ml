[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-ml"
version = "1.0.0"
description = "Cost-aware credit card fraud detection on highly imbalanced data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Neria Fay Arinda" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fraud-train = "fraud.train:main"
fraud-predict = "fraud.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
